[project]
name = "mkcb-client"
version = "0.1.0"
description = "MKCB Windows client"
requires-python = ">=3.11,<3.12"
dependencies = [
  "argon2-cffi>=23.1,<24",
  "cryptography>=43,<45",
  "loguru>=0.7.3,<0.8",
  "pydantic>=2.7,<3",
  "pymongo>=4.6,<4.10",
  "PySide6-Essentials>=6.6,<6.7",
  "pywin32>=306,<309; sys_platform == 'win32'",
  "zstandard>=0.22,<0.23",
]

[tool.uv]
# The client is run from the repository checkout and is not installed as a wheel.
package = false
